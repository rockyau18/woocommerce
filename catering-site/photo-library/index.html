<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Lumina 相片審核</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--ok:#2d6a4f;--bad:#9b2226;--muted:#9aa3b2;--acc:#95d5b2}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:#f2f2f2}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
h1{margin:0 0 6px;font-size:1.15rem}
.help{margin:0 0 10px;color:var(--muted);font-size:.85rem;line-height:1.45;max-width:95ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab,.subtab{appearance:none;border:1px solid var(--line);background:#151820;color:#eee;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem}
.tab.active,.subtab.active{background:var(--ok);border-color:var(--ok)}
.subtabs{display:none;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.subtabs.show{display:flex}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .counts{font-size:.85rem;color:var(--muted);margin-right:4px}
.toolbar button,.chip{appearance:none;border:1px solid var(--line);background:#151820;color:#eee;padding:7px 11px;border-radius:999px;cursor:pointer;font-size:.8rem}
.chip.active{background:#243049;border-color:#3d5a80}
.toolbar button.primary{background:#1b4332;border-color:#2d6a4f}
.toolbar button.warn{background:#3d1214;border-color:#9b2226}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{margin:0;background:var(--card);border-radius:12px;overflow:hidden;border:2px solid transparent;position:relative}
.card.mark-ok{border-color:var(--ok)}
.card.mark-bad{border-color:var(--bad);opacity:.72}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#222}
.card figcaption{padding:10px 12px 12px;font-size:.86rem;line-height:1.4}
.card .id{font-weight:700;word-break:break-all}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;margin-left:6px;vertical-align:middle}
.badge.new{background:#2d6a4f}
.badge.ok{background:var(--ok)}
.badge.bad{background:var(--bad)}
.badge.folder{background:#2b3344;color:#c9d1d9}
.badge.asset{background:#3d2c29;color:#f4c7b8}
.path{display:block;font-size:.72rem;color:var(--muted);margin-top:4px;word-break:break-all}
.uses{display:block;font-size:.72rem;color:#b8c0cc;margin-top:4px}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{flex:1;appearance:none;border:1px solid var(--line);background:#12151c;color:#eee;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.78rem}
.actions button.ok:hover,.actions button.ok.on{background:var(--ok);border-color:var(--ok)}
.actions button.bad:hover,.actions button.bad.on{background:var(--bad);border-color:var(--bad)}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
.toast{position:fixed;bottom:18px;right:18px;background:#1b4332;border:1px solid #2d6a4f;padding:10px 14px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Lumina 相片審核</h1>
  <p class="help">網站現用相可切「依圖檔（去重）」與「依出現位置」。建議先在去重裡標不合格——會自動把該圖所有出現位置也標不合格；若某一頁仍可用，再到出現位置把那一處單獨改回合格。本地用 localStorage；線上版標記同步伺服器、同事共用。</p>
  <div class="tabs">
    <button class="tab active" data-tab="candidates">候選相冊</button>
    <button class="tab" data-tab="site">網站現用相</button>
  </div>
  <div class="subtabs" id="siteSubtabs">
    <button class="subtab" data-site-mode="placements">依出現位置（全部）</button>
    <button class="subtab active" data-site-mode="files">依圖檔（去重）</button>
  </div>
  <div class="toolbar" id="toolbar"></div>
</header>
<main>
  <div id="chips" class="toolbar" style="margin-bottom:12px"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>沒有符合條件的圖片</div>
</main>

, "kind": "placement"}, {"id": "gourmet-canapes__service-private-celebrations__img2", "assetId": "gourmet-canapes", "path": "templates/page-service.php (private-celebrations/img2)", "src": "../wp-theme/lumina-catering/assets/images/gourmet-canapes-800.webp", "zh": "私人慶祝詳頁 · img2 · 精緻小食", "en": "private-celebrations/img2 → gourmet-canapes", "folder": "service/private-celebrations", "folderLabel": "私人慶祝詳頁", "page": "service/private-celebrations", "uses": ["page-service.php:private-celebrations:img2"], "new": false, "kind": "placement"}, {"id": "full-service__service-full-service__hero", "assetId": "full-service", "path": "templates/page-service.php (full-service/hero)", "src": "../wp-theme/lumina-catering/assets/images/full-service-800.webp", "zh": "全服務詳頁 · hero · 全服務", "en": "full-service/hero → full-service", "folder": "service/full-service", "folderLabel": "全服務詳頁", "page": "service/full-service", "uses": ["page-service.php:full-service:hero"], "new": false, "kind": "placement"}, {"id": "buffet-station__service-full-service__img1", "assetId": "buffet-station", "path": "templates/page-service.php (full-service/img1)", "src": "../wp-theme/lumina-catering/assets/images/buffet-station-800.webp", "zh": "全服務詳頁 · img1 · 自助站", "en": "full-service/img1 → buffet-station", "folder": "service/full-service", "folderLabel": "全服務詳頁", "page": "service/full-service", "uses": ["page-service.php:full-service:img1"], "new": false, "kind": "placement"}, {"id": "charity-gala__service-full-service__img2", "assetId": "charity-gala", "path": "templates/page-service.php (full-service/img2)", "src": "../wp-theme/lumina-catering/assets/images/charity-gala-800.webp", "zh": "全服務詳頁 · img2 · 慈善晚宴", "en": "full-service/img2 → charity-gala", "folder": "service/full-service", "folderLabel": "全服務詳頁", "page": "service/full-service", "uses": ["page-service.php:full-service:img2"], "new": false, "kind": "placement"}]};
const KEYS = {
  candidates: 'lumina-candidate-marks',
  site: 'lumina-site-marks-v2'
};
let tab = 'candidates';
let siteMode = 'files'; // placements | files — 先去重連動，再細調出現位置
let hideBad = false;
let onlyBad = false;
let folderFilter = 'all';

function loadMarks(which){
  try { return JSON.parse(localStorage.getItem(KEYS[which]) || '{}') || {}; }
  catch(e){ return {}; }
}
function saveMarks(which, marks){
  localStorage.setItem(KEYS[which], JSON.stringify(marks));
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}
function items(){
  if (tab === 'candidates') return DATA.candidates;
  return siteMode === 'files' ? DATA.siteFiles : DATA.sitePlacements;
}
function markKey(){ return tab; }
function counts(){
  const marks = loadMarks(markKey());
  let ok=0,bad=0,unset=0;
  for (const it of items()){
    const m = marks[it.id];
    if (m === 'ok') ok++; else if (m === 'bad') bad++; else unset++;
  }
  return {ok,bad,unset,total: items().length};
}
function setMark(id, value){
  const marks = loadMarks(markKey());
  if (!value) delete marks[id]; else marks[id] = value;

  // 依圖檔去重：標記會連動所有出現位置；之後可在「依出現位置」單獨改回合格
  if (tab === 'site' && siteMode === 'files') {
    const assetId = id;
    let n = 0;
    for (const pl of (DATA.sitePlacements || [])) {
      if ((pl.assetId || pl.id) !== assetId) continue;
      if (!value) delete marks[pl.id];
      else marks[pl.id] = value;
      n++;
    }
    if (n && value === 'bad') toast(`已同步 ${n} 處出現位置為不合格（可再到「依出現位置」單獨改回合格）`);
    else if (n && value === 'ok') toast(`已同步 ${n} 處出現位置為合格`);
    else if (n && !value) toast(`已清除 ${n} 處出現位置標記`);
  }

  saveMarks(markKey(), marks);
  render();
}
function exportBad(){
  const marks = loadMarks(markKey());
  const rejected = items().filter(it => marks[it.id] === 'bad').map(it => ({
    id: it.id,
    assetId: it.assetId || it.id,
    path: it.path,
    zh: it.zh,
    en: it.en,
    page: it.page || '',
    tab,
    siteMode: tab==='site' ? siteMode : null
  }));
  const text = [
    `# Lumina 不合格清單 (${tab === 'candidates' ? '候選' : '網站現用/' + siteMode})`,
    `# 共 ${rejected.length} 項 — 可貼給 agent：「刪這些／換掉這些」`,
    '',
    ...rejected.map(r => `${r.id}\t${r.assetId || ''}\t${r.path}\t${r.zh}`),
    '',
    'JSON:',
    JSON.stringify(rejected, null, 2)
  ].join('\n');
  navigator.clipboard.writeText(text).then(()=>toast(`已複製 ${rejected.length} 項不合格清單`)).catch(()=>{
    const blob = new Blob([text], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lumina-${tab}-rejects.txt`;
    a.click();
    toast('已下載不合格清單');
  });
}
function clearMarks(){
  if (!confirm('清除此分頁所有標記？')) return;
  saveMarks(markKey(), {});
  render();
}
function updateSiteSubtabs(){
  const el = document.getElementById('siteSubtabs');
  el.classList.toggle('show', tab === 'site');
  el.querySelectorAll('.subtab').forEach(b=>{
    b.classList.toggle('active', b.dataset.siteMode === siteMode);
  });
}
function renderToolbar(){
  const c = counts();
  const modeNote = tab==='site' ? (siteMode==='placements' ? '（出現位置）' : '（圖檔去重）') : '';
  document.getElementById('toolbar').innerHTML = `
    <span class="counts">合計 ${c.total}${modeNote}　合格 ${c.ok}　不合格 ${c.bad}　未標記 ${c.unset}</span>
    <button class="${hideBad?'primary':''}" id="btnHide">${hideBad?'顯示全部':'隱藏不合格'}</button>
    <button class="${onlyBad?'warn':''}" id="btnOnlyBad">${onlyBad?'取消只看不合格':'只看不合格'}</button>
    <button class="warn" id="btnExport">匯出不合格清單</button>
    <button id="btnClear">清除此頁標記</button>
  `;
  document.getElementById('btnHide').onclick = ()=>{ hideBad=!hideBad; if(hideBad) onlyBad=false; render(); };
  document.getElementById('btnOnlyBad').onclick = ()=>{ onlyBad=!onlyBad; if(onlyBad) hideBad=false; render(); };
  document.getElementById('btnExport').onclick = exportBad;
  document.getElementById('btnClear').onclick = clearMarks;

  const folders = ['all', ...new Set(items().map(i=>i.folder))];
  document.getElementById('chips').innerHTML = folders.map(f=>{
    const label = f==='all' ? '全部頁面／場合' : (items().find(i=>i.folder===f)?.folderLabel || f);
    return `<button class="chip ${folderFilter===f?'active':''}" data-folder="${f}">${label}</button>`;
  }).join('');
  document.querySelectorAll('#chips .chip').forEach(btn=>{
    btn.onclick = ()=>{ folderFilter = btn.dataset.folder; render(); };
  });
}
function renderGrid(){
  const marks = loadMarks(markKey());
  let list = items().filter(it => folderFilter==='all' || it.folder===folderFilter);
  if (hideBad) list = list.filter(it => marks[it.id] !== 'bad');
  if (onlyBad) list = list.filter(it => marks[it.id] === 'bad');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!list.length){ grid.innerHTML=''; empty.hidden=false; return; }
  empty.hidden=true;
  grid.innerHTML = list.map(it=>{
    const m = marks[it.id];
    const cls = m==='ok'?'mark-ok':(m==='bad'?'mark-bad':'');
    const status = m==='ok'?'<span class="badge ok">合格</span>':(m==='bad'?'<span class="badge bad">不合格</span>':'');
    const neu = it.new ? '<span class="badge new">NEW</span>' : '';
    const asset = it.assetId ? `<span class="badge asset">圖檔 ${it.assetId}</span>` : '';
    const uses = (it.uses && it.uses.length) ? `<span class="uses">${it.uses.slice(0,8).join(' · ')}${it.uses.length>8?'…':''}</span>` : '';
    return `<figure class="card ${cls}" data-id="${it.id}">
      <img src="${it.src}" loading="lazy" alt="${it.id}">
      <figcaption>
        <span class="id">${it.kind==='placement' ? (it.folderLabel + ' · ' + (it.assetId||'')) : it.id}</span>${neu}${status}${asset}
        <span class="badge folder">${it.folderLabel||''}</span><br>
        ${it.zh}${it.en && it.en!==it.zh ? '<br><span class="path">'+it.en+'</span>' : ''}
        <span class="path">${it.path}</span>
        ${uses}
        <div class="actions">
          <button class="ok ${m==='ok'?'on':''}" data-act="ok">合格</button>
          <button class="bad ${m==='bad'?'on':''}" data-act="bad">不合格</button>
          <button data-act="clear">清除</button>
        </div>
      </figcaption>
    </figure>`;
  }).join('');
  grid.querySelectorAll('.actions button').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.closest('.card').dataset.id;
      const act = btn.dataset.act;
      const cur = loadMarks(markKey())[id];
      if (act==='ok') setMark(id, cur==='ok' ? null : 'ok');
      else if (act==='bad') setMark(id, cur==='bad' ? null : 'bad');
      else setMark(id, null);
    };
  });
}
function render(){ updateSiteSubtabs(); renderToolbar(); renderGrid(); }
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick = ()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===btn));
    folderFilter = 'all';
    hideBad = false;
    onlyBad = false;
    render();
  };
});
document.querySelectorAll('.subtab').forEach(btn=>{
  btn.onclick = ()=>{
    siteMode = btn.dataset.siteMode;
    folderFilter = 'all';
    render();
  };
});
render();
</script>
</body>
</html>
